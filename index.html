<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Every Moment with You is Beautiful</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      background: radial-gradient(circle at 50% 30%, #1a1e29 0%, #080a0f 100%);
      font-family: 'Poppins', sans-serif;
    }

    #flowerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .message {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      text-align: center;
      max-width: 480px;
      width: 88%;
      padding: 26px 20px;
      background: rgba(15, 20, 28, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.85),
        inset 0 0 15px rgba(255, 255, 255, 0.05),
        0 0 30px rgba(255, 183, 3, 0.15);
      pointer-events: none;
      animation: fadeIn 1.8s ease-in-out;
    }

    .message::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffb703, transparent);
    }

    .date {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ffb703;
      margin-bottom: 12px;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 183, 3, 0.8);
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.25;
      text-shadow: 
        0 0 18px rgba(255, 255, 255, 0.9),
        0 0 30px rgba(255, 183, 3, 0.4),
        0 4px 10px rgba(0, 0, 0, 0.9);
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      line-height: 1.7;
      color: #f1f2f6;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translate(-50%, -45%); }
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }

    @media (max-width: 600px) {
      .message {
        top: 58%;
        width: 90%;
        padding: 22px 16px;
        border-radius: 20px;
      }
      .date {
        font-size: 11px;
        letter-spacing: 3px;
      }
      .title {
        font-size: 24px;
      }
      .subtitle {
        font-size: 14px;
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>

  <div class="message">
    <p class="date">Our date : JUNE 19, 2025</p>
    <h1 class="title">Every Moment with you is Beautiful and Endlessly</h1>
    <p class="subtitle">
      I grew these flowers just for you.<br>
      They will never fade,<br>
      just like my love for you.
    </p>
  </div>

  <canvas id="flowerCanvas"></canvas>

  <script src="java.js"></script>
</body>
</html>
